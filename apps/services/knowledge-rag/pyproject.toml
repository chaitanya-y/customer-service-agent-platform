[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-rag"
version = "0.1.0"
description = "Production-oriented knowledge ingestion, retrieval, and evaluation workload"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cso-observability",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.140,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "pypdf>=6.0,<7",
  "PyJWT>=2.10,<3",
  "python-docx>=1.2,<2",
  "tiktoken>=0.12,<1",
  "openai>=2.0,<3",
  "opensearch-py>=3,<4",
  "python-dotenv>=1.2,<2",
  "sentence-transformers>=5,<6",
  "torch==2.13.0",
  "uvicorn[standard]>=0.51,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.1,<10",
  "ruff>=0.16,<1"
]

[tool.uv.sources]
cso-observability = { path = "../../../packages/python-observability", editable = true }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["knowledge_rag"]
